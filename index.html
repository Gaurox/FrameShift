<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=https://gaurox.dev/frameshift/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrameShift moved to gaurox.dev</title>
  <meta name="description" content="The official FrameShift page has moved to gaurox.dev." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://gaurox.dev/frameshift/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FrameShift moved to gaurox.dev" />
  <meta property="og:description" content="The official FrameShift page is now hosted on gaurox.dev." />
  <meta property="og:url" content="https://gaurox.dev/frameshift/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="FrameShift moved to gaurox.dev" />
  <meta name="twitter:description" content="The official FrameShift page is now hosted on gaurox.dev." />
  <script>
    window.location.replace("https://gaurox.dev/frameshift/");
  </script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: rgba(255,255,255,.92);
      --surface-border: #d8e2f2;
      --text-primary: #1f283a;
      --text-secondary: #525e73;
      --blue: #4d79b4;
      --blue-hover: #3f6699;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(142, 186, 243, 0.30), transparent 30rem),
        radial-gradient(circle at bottom right, rgba(77, 121, 180, 0.14), transparent 34rem),
        var(--bg);
      color: var(--text-primary);
    }

    .panel {
      width: min(680px, 100%);
      padding: 36px;
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(31, 40, 58, 0.10);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 0 20px;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }

    a:hover { background: var(--blue-hover); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>FrameShift moved</h1>
    <p>The official FrameShift page is now hosted on gaurox.dev.</p>
    <a href="https://gaurox.dev/frameshift/">Open the new FrameShift page</a>
  </main>
</body>
</html>
